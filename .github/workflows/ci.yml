name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site

  links:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      # Own absolute URLs point at production, which lags behind PRs; 403/429 are bot blocks
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --root-dir "${{ github.workspace }}/_site"
            --exclude "^https://jarjan\.xyz"
            --accept "200..=299,403,429"
            "_site/**/*.html"
